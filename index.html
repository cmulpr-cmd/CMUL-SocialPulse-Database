function showErr(m){document.getElementById('splash').style.display='none';document.getElementById('err').style.display='flex';document.getElementById('errm').textContent=m;}
function tryLoad(libIdx,urlIdx){
  var lib=libs[libIdx];
  if(urlIdx>=lib.urls.length){showErr('โหลด '+lib.n+' ไม่สำเร็จจากทุก CDN');return;}
  var url=lib.urls[urlIdx];
  var cdn=url.indexOf('jsdelivr')>=0?'jsdelivr':url.indexOf('unpkg')>=0?'unpkg':'cdnjs';
  st.textContent='โหลด '+lib.n+' จาก '+cdn+'... ('+(libIdx+1)+'/'+libs.length+')';
  var s=document.createElement('script');s.src=url;
  s.onload=function(){
    if(lib.g && !window[lib.g]){console.warn(lib.n+' from '+cdn+' failed, trying next');tryLoad(libIdx,urlIdx+1);return;}
    loadLib(libIdx+1);
  };
  s.onerror=function(){console.warn(lib.n+' 404 from '+cdn);tryLoad(libIdx,urlIdx+1);};
  document.head.appendChild(s);
}
function loadLib(i){
  if(i>=libs.length){st.textContent='เริ่มต้นแอป...';setTimeout(initApp,100);return;}
  tryLoad(i,0);
}
loadLib(0);
function initApp(){
  try{
    var src=document.getElementById('app-src').textContent;
    var code=Babel.transform(src,{presets:['react']}).code;
    (new Function(code))();
    var sp=document.getElementById('splash');sp.classList.add('done');setTimeout(function(){sp.style.display='none';},500);
  }catch(e){console.error(e);showErr('เกิดข้อผิดพลาด: '+e.message);}
}

const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxnNG4mr7hVsHUcLpBgdYtK_2-D71S-YKXg5ANujqpPeifaP3NHFP4jDCph87HP1YEJYw/exec';

/* ═══ API HELPERS ═══ */
const api = {
  async get(action, params = {}) {
    if (!USE_SHEETS) return null;
    try {
      const url = new URL(GOOGLE_SCRIPT_URL);
      url.searchParams.set('action', action);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
      const r = await fetch(url.toString());
      return await r.json();
    } catch(e) { console.error('API get error:', e); return null; }
  },
  async post(data) {
    if (!USE_SHEETS) return { success: true, offline: true };
    try {
      const r = await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(data)
      });
      return await r.json();
    } catch(e) { console.error('API post error:', e); return { success: false, error: e.message }; }
  }
};

async function askGemini(prompt, context = '') {
  if (!USE_GEMINI) {
    return 'โปรดตั้งค่า GEMINI_API_KEY ในโค้ดก่อนใช้งาน AI\n\nวิธีทำ:\n1. เข้า https://aistudio.google.com/app/apikey\n2. Create API Key\n3. Copy Key ใส่ในตัวแปร GEMINI_API_KEY';
  }
  try {
    const fullPrompt = context ? `${context}\n\nคำถาม: ${prompt}` : prompt;
    const r = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,
      {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          contents: [{ parts: [{ text: fullPrompt }] }],
          generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
        })
      }
    );
    const data = await r.json();
    if (data.error) return 'ข้อผิดพลาด: ' + data.error.message;
    return data.candidates?.[0]?.content?.parts?.[0]?.text || 'ไม่มีคำตอบ';
  } catch(e) { return 'ข้อผิดพลาด: ' + e.message; }
}

// Beautiful button component
const Btn = ({variant='primary', size='md', onClick, children, disabled, loading, style={}, icon}) => {
  const [hover, setHover] = useState(false);
  const [press, setPress] = useState(false);
  const sizes = {
    sm: {padding:'6px 14px', fontSize:12},
    md: {padding:'10px 20px', fontSize:13},
    lg: {padding:'14px 28px', fontSize:15},
  };
  const variants = {
    primary: {
      background: hover ? 'linear-gradient(135deg,#5a4bd1,#8b7ff5)' : 'linear-gradient(135deg,#6c5ce7,#a29bfe)',
      color:'white', boxShadow: hover ? '0 8px 20px rgba(108,92,231,0.4)' : '0 4px 12px rgba(108,92,231,0.3)'
    },
    success: {
      background: hover ? '#00a884' : 'linear-gradient(135deg,#00b894,#55efc4)',
      color:'white', boxShadow: hover ? '0 8px 20px rgba(0,184,148,0.4)' : '0 4px 12px rgba(0,184,148,0.25)'
    },
    danger: {
      background: hover ? '#d15b3d' : 'linear-gradient(135deg,#e17055,#ff8c69)',
      color:'white', boxShadow: hover ? '0 8px 20px rgba(225,112,85,0.4)' : '0 4px 12px rgba(225,112,85,0.25)'
    },
    ghost: {
      background: hover ? '#f0f0f5' : 'transparent', color: T.gray,
      border: '1px solid #dfe6e9'
    },
    outline: {
      background: hover ? 'rgba(108,92,231,0.08)' : 'transparent',
      color: T.primary, border: '1.5px solid ' + T.primary
    },
  };
  return <button
    onClick={onClick} disabled={disabled||loading}
    onMouseEnter={()=>setHover(true)} onMouseLeave={()=>{setHover(false); setPress(false);}}
    onMouseDown={()=>setPress(true)} onMouseUp={()=>setPress(false)}
    style={{
      border:'none', borderRadius:10, cursor:disabled||loading?'not-allowed':'pointer',
      fontWeight:600, fontFamily:'inherit',
      display:'inline-flex', alignItems:'center', gap:6,
      transition:'all 0.2s cubic-bezier(0.4,0,0.2,1)',
      transform: press ? 'scale(0.97)' : hover ? 'translateY(-1px)' : 'translateY(0)',
      opacity: disabled ? 0.5 : 1,
      ...sizes[size], ...variants[variant], ...style

};

// Modal component with backdrop blur and fade
const Modal = ({open, onClose, title, children, width='500px', footer}) => {
  const [mounted, setMounted] = useState(false);
  useEffect(() => {
    if (open) { setMounted(true); document.body.style.overflow = 'hidden'; }
    else { document.body.style.overflow = ''; setTimeout(() => setMounted(false), 200); }
    return () => { document.body.style.overflow = ''; };
  }, [open]);
  if (!mounted && !open) return null;
  return <div style={{
    position:'fixed', inset:0, zIndex:1000,
    display:'flex', alignItems:'center', justifyContent:'center',
    padding:20, animation: open?'fadeIn 0.2s ease':'fadeOut 0.2s ease',
    opacity: open ? 1 : 0
  }}>
    <div onClick={onClose} style={{
      position:'absolute', inset:0,
      background:'rgba(15,15,35,0.6)', backdropFilter:'blur(8px)',
      WebkitBackdropFilter:'blur(8px)'
    }}/>
    <div style={{
      position:'relative', background:'white', borderRadius:20, width:'100%',
      maxWidth:width, maxHeight:'90vh', display:'flex', flexDirection:'column',
      boxShadow:'0 25px 80px rgba(0,0,0,0.3)',
      animation: open?'modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1)':'modalOut 0.2s ease',
      overflow:'hidden'
    }}>

        <div style={{fontWeight:700, fontSize:16, color:T.dark}}>{title}</div>
        <button onClick={onClose} style={{
          border:'none', background:T.bg, borderRadius:10, width:32, height:32,
          cursor:'pointer', fontSize:16, color:T.gray,
          display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.2s'
        }} onMouseEnter={e=>e.currentTarget.style.background='#e8e8f0'}
          onMouseLeave={e=>e.currentTarget.style.background=T.bg}>✕</button>
      </div>}
      <div style={{padding:'20px 24px', overflowY:'auto', flex:1}}>{children}</div>
      {footer && <div style={{padding:'16px 24px', borderTop:'1px solid '+T.border, display:'flex', gap:8, justifyContent:'flex-end'}}>{footer}</div>}
    </div>
  </div>;
};

// Toast notification
const useToast = () => {
  const [toasts, setToasts] = useState([]);
  const show = (msg, type='success') => {
    const id = Date.now();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  };
  const Toaster = () => <div style={{position:'fixed', top:20, right:20, zIndex:2000, display:'flex', flexDirection:'column', gap:8}}>
    {toasts.map(t => <div key={t.id} style={{
      padding:'12px 20px', borderRadius:12, color:'white', fontWeight:500, fontSize:14,
      background: t.type==='success' ? 'linear-gradient(135deg,#00b894,#55efc4)' :
                  t.type==='error' ? 'linear-gradient(135deg,#e17055,#ff8c69)' :
                  'linear-gradient(135deg,#0984e3,#74b9ff)',
      boxShadow:'0 8px 24px rgba(0,0,0,0.15)', animation:'slideInRight 0.3s ease',
      display:'flex', alignItems:'center', gap:8
    }}>
      <span>{t.type==='success'?'✅':t.type==='error'?'❌':'ℹ️'}</span>{t.msg}
    </div>)}
  </div>;
  return {show, Toaster};
};

/* ═══ LOGIN PAGE ═══ */
const LoginPage = ({users, onLogin, onRequestAccess, toast}) => {
  const [u, sU] = useState(''), [p, sP] = useState('');
  const [ps, sPs] = useState('idle'), [mu, sMu] = useState(null);
  const [pf, sPf] = useState(false), [sr, sSr] = useState(false);
  const [rn, sRn] = useState(''), [ru, sRu] = useState(''), [rp, sRp] = useState('');
  const [rs, sRs] = useState(false), [shake, sSh] = useState(false), [loading, sL] = useState(false);
  
  useEffect(() => {
    if (pf) { sPs('covering'); return; }
    if (u.length >= 3) {
      const f = users.find(x => String(x.username).toLowerCase() === u.toLowerCase() && x.approved);
      if (f) { sMu(f); sPs('happy'); } else { sMu(null); sPs('curious'); }
    } else { sMu(null); sPs('idle'); }
  }, [u, pf, users]);
  
  const doLogin = async () => {
    sL(true);
    if (USE_SHEETS) {
      const res = await api.post({action:'login', username:u, password:p});
      sL(false);
      if (res?.success) { onLogin(res.user); }
      else { toast(res?.error || 'เข้าสู่ระบบล้มเหลว', 'error'); sSh(true); setTimeout(()=>sSh(false),600); }
    } else {
      const user = users.find(x => String(x.username).toLowerCase() === u.toLowerCase() && String(x.password) === p && x.approved);
      sL(false);
      if (user) onLogin(user);
      else { toast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error'); sSh(true); setTimeout(()=>sSh(false),600); }

  const doReq = async () => {
    if (!rn || !ru || !rp) { toast('กรอกข้อมูลให้ครบ', 'error'); return; }

    if (USE_SHEETS) await api.post({action:'requestAccess', name:rn, username:ru, password:rp});
    else onRequestAccess({name:rn, username:ru, password:rp});

      <div style={{textAlign:'center', marginBottom:8}}>

/* ═══ DASHBOARD PAGE — beautiful overview ═══ */
const DashPage = ({entries, metrics}) => {
  const [range, setRange] = useState('month');
  
  const filtered = useMemo(() => {
    const now = new Date();
    return entries.filter(e => {
      const d = new Date(e.date);
      if (range === 'day') return e.date === today();
      if (range === 'week') { const w = new Date(); w.setDate(w.getDate()-7); return d >= w; }
      if (range === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      if (range === 'year') return d.getFullYear() === now.getFullYear();
      return true;
    });
  }, [entries, range]);
  
  const totals = useMemo(() => {
    const t = {};
    PLATFORMS.forEach(p => { t[p.id] = {}; metrics.forEach(m => t[p.id][m.id] = 0); });
    filtered.forEach(e => {
      if (t[e.platform]) metrics.forEach(m => {
        const v = e.metrics?.[m.id];
        t[e.platform][m.id] += Number(v) || 0;
      });
    });
    return t;
  }, [filtered, metrics]);
  
  const grand = useMemo(() => {
    const g = {}; metrics.forEach(m => g[m.id] = 0);
    Object.values(totals).forEach(t => metrics.forEach(m => g[m.id] += t[m.id] || 0));
    return g;
  }, [totals, metrics]);
  
  const trendData = useMemo(() => {
    const byDate = {};
    filtered.forEach(e => {
      if (!byDate[e.date]) { byDate[e.date] = {}; PLATFORMS.forEach(p => byDate[e.date][p.id]=0); }
      if (e.platform) byDate[e.date][e.platform] += Number(e.metrics?.engagement) || Number(e.metrics?.reach) || 0;
    });
    return Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).slice(-14).map(([d,v])=>({name:d.slice(5), ...v}));
  }, [filtered]);
  
  const pieData = PLATFORMS.map(p => ({
    name: p.name,
    value: totals[p.id]?.engagement || totals[p.id]?.reach || 0,
    color: p.color
  })).filter(p => p.value > 0);
  
  const ranges = [{k:'day',l:'วันนี้'},{k:'week',l:'สัปดาห์'},{k:'month',l:'เดือน'},{k:'year',l:'ปี'},{k:'all',l:'ทั้งหมด'}];
  
  return <PageWrap keyId="dashboard">
  <div style={{padding:'24px 28px', maxWidth:1400}}>
    <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:24, flexWrap:'wrap', gap:16}}>
      <div>
        <div style={{fontSize:28, fontWeight:800, color:T.dark, letterSpacing:-0.5}}>ภาพรวมทั้งหมด</div>
        <div style={{fontSize:13, color:T.gray, marginTop:4}}>สรุปผลการดำเนินงานทุกแพลตฟอร์ม</div>
      </div>
      <div style={{display:'flex', gap:6, background:'white', padding:4, borderRadius:12, boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
        {ranges.map(r => <button key={r.k} onClick={()=>setRange(r.k)} style={{
          padding:'8px 16px', borderRadius:9, border:'none',
          background: range===r.k ? 'linear-gradient(135deg,#6c5ce7,#a29bfe)' : 'transparent',
          color: range===r.k ? 'white' : T.gray, fontSize:13, cursor:'pointer',
          fontWeight: range===r.k ? 600 : 500, transition:'all 0.2s', fontFamily:'inherit',
          boxShadow: range===r.k ? '0 4px 12px rgba(108,92,231,0.3)' : 'none'
        }}>{r.l}</button>)}
      </div>
    </div>
    
    {/* Hero stats */}
    <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))', gap:16, marginBottom:24}}>
      {[
        {label:'ผู้ติดตามรวม', val: grand.followers, icon:'👥', color:'#6c5ce7'},
        {label:'การเข้าถึงรวม', val: grand.reach, icon:'📈', color:'#00b894'},
        {label:'การมีส่วนร่วมรวม', val: grand.engagement, icon:'🤝', color:'#fdcb6e'},
        {label:'คลิกลิงก์รวม', val: grand.clicks, icon:'👆', color:'#e84393'},
      ].map((s,i) => <Card key={i} hover style={{background:'linear-gradient(135deg,white,white)'}}>
        <div style={{display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:12}}>
          <div style={{width:48, height:48, borderRadius:14, background:s.color+'15', display:'flex', alignItems:'center', justifyContent:'center', fontSize:22}}>{s.icon}</div>
        </div>
        <div style={{fontSize:12, color:T.gray, marginBottom:4}}>{s.label}</div>
        <div style={{fontSize:28, fontWeight:800, color:T.dark, letterSpacing:-0.5}}>{fmt(s.val)}</div>
      </Card>)}
    </div>
    
    {/* Platform breakdown */}
    <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))', gap:16, marginBottom:24}}>
      {PLATFORMS.map(p => <Card key={p.id} hover style={{padding:0, overflow:'hidden'}}>
        <div style={{background: p.bg, padding:'16px 20px', color:'white'}}>
          <div style={{display:'flex', alignItems:'center', gap:10}}>
            <span style={{fontSize:24}}>{p.icon}</span>
            <span style={{fontWeight:700, fontSize:15}}>{p.name}</span>
          </div>
        </div>
        <div style={{padding:'16px 20px'}}>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
            {metrics.slice(0,4).map(m => <div key={m.id}>
              <div style={{fontSize:10, color:T.lightGray}}>{m.icon} {m.name}</div>
              <div style={{fontSize:16, fontWeight:700, color:T.dark}}>{fmt(totals[p.id]?.[m.id] || 0)}</div>
            </div>)}
          </div>
        </div>
      </Card>)}
    </div>
    
    {/* Charts */}
    <div style={{display:'grid', gridTemplateColumns:'2fr 1fr', gap:16, marginBottom:24}}>
      <Card>
        <div style={{fontWeight:700, fontSize:16, marginBottom:4}}>📈 แนวโน้ม 14 วันล่าสุด</div>
        <div style={{fontSize:12, color:T.gray, marginBottom:16}}>Engagement รายวันของทุกแพลตฟอร์ม</div>
        {trendData.length > 0 ? <ResponsiveContainer width="100%" height={280}>
          <AreaChart data={trendData}>
            <defs>{PLATFORMS.map(p => <linearGradient key={p.id} id={'g'+p.id} x1="0" y1="0" x2="0" y2="1">
              <stop offset="5%" stopColor={p.color} stopOpacity={0.3}/>

      </Card>
      <Card>
        <div style={{fontWeight:700, fontSize:16, marginBottom:4}}>🥧 สัดส่วน Engagement</div>
        <div style={{fontSize:12, color:T.gray, marginBottom:16}}>แยกตามแพลตฟอร์ม</div>
        {pieData.length > 0 ? <React.Fragment>
          <ResponsiveContainer width="100%" height={200}>
            <PieChart>
              <Pie data={pieData} dataKey="value" cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={3}>
                {pieData.map((d,i) => <Cell key={i} fill={d.color}/>)}
              </Pie>
              <Tooltip formatter={v => fmt(v)}/>
            </PieChart>
          </ResponsiveContainer>
          <div style={{marginTop:12}}>{pieData.map((d,i) => <div key={i} style={{display:'flex', alignItems:'center', gap:8, marginBottom:6, fontSize:12}}>
            <div style={{width:10, height:10, borderRadius:'50%', background:d.color}}/>
            <span style={{flex:1, color:T.gray}}>{d.name}</span>
            <span style={{fontWeight:600}}>{fmt(d.value)}</span>

    </div>

};

/* ═══ DATA ENTRY PAGE — with mini analytics dashboard on top ═══ */
const DataPage = ({user, entries, setEntries, metrics, setMetrics, toast, reload}) => {
  const [platform, setPlatform] = useState('facebook');
  const [date, setDate] = useState(today());
  const [period, setPeriod] = useState('daily');
  const [values, setValues] = useState({});
  const [saving, setSaving] = useState(false);
  const [showAddMetric, setShowAddMetric] = useState(false);
  const [newMetric, setNewMetric] = useState({name:'', unit:'ครั้ง', icon:'📊'});
  const [showHistory, setShowHistory] = useState(false);
  const formRef = useRef(null);
  
  useEffect(() => {
    const existing = entries.find(e => e.platform===platform && e.date===date && e.period===period);
    if (existing) {
      const v = {}; metrics.forEach(m => v[m.id] = existing.metrics?.[m.id] || '');
      setValues(v);
    } else {
      const v = {}; metrics.forEach(m => v[m.id] = '');
      setValues(v);
    }
  }, [platform, date, period, metrics, entries]);
  
  // Realtime analytics from current form
  const currentTotal = useMemo(() => {
    return Object.values(values).reduce((sum, v) => sum + (Number(v) || 0), 0);
  }, [values]);
  
  const previousEntry = useMemo(() => {
    const prev = entries.filter(e => e.platform===platform && e.period===period && e.date < date)
      .sort((a,b) => b.date.localeCompare(a.date))[0];
    return prev;
  }, [entries, platform, period, date]);
  
  const growthRates = useMemo(() => {
    if (!previousEntry) return {};
    const g = {};
    metrics.forEach(m => {
      const prev = Number(previousEntry.metrics?.[m.id]) || 0;
      const curr = Number(values[m.id]) || 0;
      if (prev > 0) g[m.id] = ((curr - prev) / prev * 100).toFixed(1);
    });
    return g;
  }, [values, previousEntry, metrics]);
  
  const save = async () => {
    setSaving(true);
    const entry = { date, platform, period, metrics: {} };
    metrics.forEach(m => { entry.metrics[m.id] = Number(values[m.id]) || 0; });
    setEntries(prev => {
      const idx = prev.findIndex(e => e.platform===platform && e.date===date && e.period===period);
      const newEntry = { id: Date.now(), ...entry };
      if (idx >= 0) { const n = [...prev]; n[idx] = {...n[idx], ...entry}; return n; }
      return [...prev, newEntry];
    });
    if (USE_SHEETS) {
      const res = await api.post({action:'saveEntry', ...entry, user: user.username});
      if (res?.success) toast('บันทึกสำเร็จ!', 'success');
      else toast('บันทึกไม่สำเร็จ: ' + (res?.error||'unknown'), 'error');
    } else toast('บันทึกสำเร็จ (โหมด Demo)', 'info');
    setSaving(false);
    if (reload) reload();
  };
  
  const addMetric = async () => {
    if (!newMetric.name) { toast('กรอกชื่อตัวชี้วัด', 'error'); return; }
    const id = 'custom_' + Date.now();
    const m = { id, ...newMetric, isDefault: false };
    setMetrics(prev => [...prev, m]);
    if (USE_SHEETS) await api.post({action:'addMetric', ...m});
    setNewMetric({name:'', unit:'ครั้ง', icon:'📊'});
    setShowAddMetric(false);
    toast('สร้างตัวชี้วัดใหม่แล้ว!', 'success');
  };
  
  const delMetric = async (id) => {
    setMetrics(prev => prev.filter(m => m.id !== id));
    if (USE_SHEETS) await api.post({action:'deleteMetric', id});
    toast('ลบแล้ว', 'success');
  };
  
  const scrollToForm = () => formRef.current?.scrollIntoView({behavior:'smooth', block:'start'});
  const historyData = entries.filter(e => e.platform===platform).sort((a,b) => b.date.localeCompare(a.date)).slice(0, 20);
  
  return <PageWrap keyId="data">
  <div style={{padding:'24px 28px', maxWidth:1200}}>
    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20, flexWrap:'wrap', gap:12}}>
      <div>
        <div style={{fontSize:28, fontWeight:800, color:T.dark, letterSpacing:-0.5}}>📝 กรอกข้อมูล</div>
        <div style={{fontSize:13, color:T.gray, marginTop:4}}>บันทึกข้อมูลรายวัน/สัปดาห์/เดือน/ปี พร้อมวิเคราะห์แบบ Realtime</div>
      </div>
      <div style={{display:'flex', gap:8}}>
        <Btn variant="ghost" onClick={()=>setShowHistory(true)} icon="📜">ประวัติ</Btn>
        <Btn variant="outline" onClick={()=>setShowAddMetric(true)} icon="➕">ตัวชี้วัด</Btn>
      </div>
    </div>
    
    {/* Realtime mini analytics */}
    <Card style={{marginBottom:20, background:'linear-gradient(135deg,#f8f7ff,#fff)', border:'1px solid #e0dcff'}}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
        <div style={{display:'flex', alignItems:'center', gap:10}}>
          <div style={{width:40, height:40, borderRadius:12, background:'linear-gradient(135deg,#6c5ce7,#a29bfe)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, color:'white'}}>⚡</div>
          <div>
            <div style={{fontWeight:700, fontSize:15}}>Realtime Analytics</div>
            <div style={{fontSize:11, color:T.gray}}>วิเคราะห์อัตโนมัติขณะกรอกข้อมูล</div>
          </div>
        </div>
        <Btn variant="primary" size="sm" onClick={scrollToForm} icon="⬇">ไปที่ฟอร์ม</Btn>
      </div>
      <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))', gap:12}}>
        {metrics.slice(0,6).map(m => {
          const cur = Number(values[m.id]) || 0;
          const g = growthRates[m.id];
          return <div key={m.id} style={{background:'white', padding:'12px 14px', borderRadius:12, border:'1px solid '+T.border}}>
            <div style={{fontSize:10, color:T.gray, marginBottom:4}}>{m.icon} {m.name}</div>
            <div style={{fontSize:18, fontWeight:700, color:T.dark}}>{fmt(cur)}</div>
            {g !== undefined && <div style={{fontSize:11, color: parseFloat(g) >= 0 ? T.success : T.danger, fontWeight:600}}>
              {parseFloat(g) >= 0 ? '▲' : '▼'} {Math.abs(g)}% <span style={{color:T.lightGray, fontWeight:400}}>vs ก่อนหน้า</span>
            </div>}
          </div>;
        })}
      </div>
    </Card>
    
    {/* Main form */}
    <Card style={{marginBottom:20}}>
      <div ref={formRef} style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14, marginBottom:20}}>
        <Select label="แพลตฟอร์ม" value={platform} onChange={e=>setPlatform(e.target.value)}
          options={PLATFORMS.map(p => ({value:p.id, label: p.icon+' '+p.name}))}/>
        <Input label="วันที่" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
        <Select label="ช่วงเวลา" value={period} onChange={e=>setPeriod(e.target.value)}
          options={[{value:'daily',label:'📅 รายวัน'},{value:'weekly',label:'📆 รายสัปดาห์'},{value:'monthly',label:'🗓️ รายเดือน'},{value:'yearly',label:'📊 รายปี'}]}/>
      </div>
      
      <div style={{fontWeight:700, fontSize:14, color:T.primary, marginBottom:14, display:'flex', alignItems:'center', gap:6}}>
        <span style={{width:4, height:16, background:T.primary, borderRadius:2}}></span>
        ตัวชี้วัด ({metrics.length} รายการ)
      </div>
      
      <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))', gap:12, marginBottom:20}}>
        {metrics.map(m => <div key={m.id}>
          <label style={{fontSize:12, color:T.gray, marginBottom:6, display:'block', fontWeight:500}}>{m.icon} {m.name} <span style={{color:T.lightGray}}>({m.unit})</span></label>
          <input type="number" value={values[m.id]||''} onChange={e=>setValues(p=>({...p, [m.id]:e.target.value}))} placeholder="0" style={{
            width:'100%', padding:'12px 14px', borderRadius:10, border:'2px solid #e8e6ff',
            fontSize:15, outline:'none', fontWeight:600, color:T.dark, boxSizing:'border-box',
            background:'#f8f7ff', transition:'all 0.2s', fontFamily:'inherit'
          }} onFocus={e=>{e.target.style.borderColor=T.primary; e.target.style.background='white';}}
             onBlur={e=>{e.target.style.borderColor='#e8e6ff'; e.target.style.background='#f8f7ff';}}/>
        </div>)}
      </div>
      
      <div style={{display:'flex', justifyContent:'flex-end', gap:8}}>
        <Btn variant="ghost" onClick={()=>{const v={};metrics.forEach(m=>v[m.id]='');setValues(v);}}>ล้างค่า</Btn>
        <Btn variant="primary" onClick={save} loading={saving} icon="💾">บันทึกข้อมูล</Btn>
      </div>
    </Card>
    
    {/* Modals */}
    <Modal open={showAddMetric} onClose={()=>setShowAddMetric(false)} title="✨ สร้างตัวชี้วัดใหม่"
      footer={<React.Fragment>
        <Btn variant="ghost" onClick={()=>setShowAddMetric(false)}>ยกเลิก</Btn>
        <Btn variant="success" onClick={addMetric} icon="✓">สร้าง</Btn>
      </React.Fragment>}>
      <Input label="ชื่อตัวชี้วัด" value={newMetric.name} onChange={e=>setNewMetric(p=>({...p, name:e.target.value}))} placeholder="เช่น ยอดขาย, สมาชิกใหม่" icon="📝"/>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
        <Input label="หน่วย" value={newMetric.unit} onChange={e=>setNewMetric(p=>({...p, unit:e.target.value}))} placeholder="ครั้ง, คน, บาท"/>
        <Input label="ไอคอน" value={newMetric.icon} onChange={e=>setNewMetric(p=>({...p, icon:e.target.value}))} placeholder="📊"/>
      </div>
      <div style={{fontSize:13, fontWeight:600, marginTop:20, marginBottom:8}}>ตัวชี้วัดที่มีอยู่</div>
      <div style={{maxHeight:200, overflowY:'auto'}}>
        {metrics.map(m => <div key={m.id} style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'8px 12px', borderRadius:8, background:T.bg, marginBottom:4}}>
          <div style={{fontSize:13}}>{m.icon} <strong>{m.name}</strong> <span style={{color:T.gray}}>({m.unit})</span></div>
          {!m.isDefault ? <button onClick={()=>delMetric(m.id)} style={{background:'none', border:'none', color:T.danger, cursor:'pointer', fontSize:14}}>🗑️</button> : <Badge color={T.gray}>ค่าเริ่มต้น</Badge>}
        </div>)}
      </div>
    </Modal>
    
    <Modal open={showHistory} onClose={()=>setShowHistory(false)} title={`📜 ประวัติ ${PF(platform).name}`} width="800px">
      <div style={{overflow:'auto'}}>
        <table style={{width:'100%', borderCollapse:'collapse'}}>
          <thead><tr style={{background:T.bg}}><th style={{padding:'10px 12px', textAlign:'left', fontSize:12, color:T.gray}}>วันที่</th><th style={{padding:'10px 12px', textAlign:'left', fontSize:12, color:T.gray}}>ช่วง</th>{metrics.slice(0,4).map(m => <th key={m.id} style={{padding:'10px 12px', textAlign:'left', fontSize:12, color:T.gray}}>{m.icon} {m.name}</th>)}</tr></thead>
          <tbody>{historyData.length > 0 ? historyData.map((e,i) => <tr key={i} style={{borderBottom:'1px solid '+T.border}}>
            <td style={{padding:'10px 12px', fontSize:13, fontWeight:500}}>{e.date}</td>
            <td style={{padding:'10px 12px', fontSize:12, color:T.gray}}>{e.period||'daily'}</td>
            {metrics.slice(0,4).map(m => <td key={m.id} style={{padding:'10px 12px', fontSize:13, fontWeight:600}}>{fmt(Number(e.metrics?.[m.id])||0)}</td>)}
          </tr>) : <tr><td colSpan={2+metrics.slice(0,4).length} style={{padding:40, textAlign:'center', color:T.lightGray}}>ยังไม่มีประวัติ</td></tr>}</tbody>
        </table>
      </div>
    </Modal>
  </div>
  </PageWrap>;
};

/* ═══ REPORTS PAGE — per platform with AI ═══ */
const RepPage = ({user, entries, metrics, toast}) => {
  const [platform, setPlatform] = useState('facebook');
  const [showAI, setShowAI] = useState(false);
  const [aiPrompt, setAiPrompt] = useState('');
  const [aiResp, setAiResp] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  
  const platformEntries = entries.filter(e => e.platform === platform);
  const sortedByDate = platformEntries.sort((a,b) => a.date.localeCompare(b.date)).slice(-30);
  
  const totals = useMemo(() => {
    const t = {}; metrics.forEach(m => t[m.id] = 0);
    platformEntries.forEach(e => metrics.forEach(m => t[m.id] += Number(e.metrics?.[m.id])||0));
    return t;
  }, [platformEntries, metrics]);
  
  const trendData = sortedByDate.map(e => {
    const r = {name: e.date.slice(5)};
    metrics.slice(0,4).forEach(m => r[m.id] = Number(e.metrics?.[m.id])||0);
    return r;
  });
  
  const pieData = metrics.slice(0,5).map((m,i) => ({
    name: m.name, value: totals[m.id],
    color: ['#6c5ce7','#00b894','#fdcb6e','#e17055','#0984e3'][i]
  })).filter(d => d.value > 0);
  
  const askAI = async () => {
    if (!aiPrompt) { toast('กรอกคำถาม', 'error'); return; }
    setAiLoading(true);
    const context = `ข้อมูลของ ${PF(platform).name}:\nยอดรวม: ${JSON.stringify(totals)}\nจำนวนบันทึกทั้งหมด: ${platformEntries.length}\nกรอบเวลาล่าสุด 30 วัน`;
    const resp = await askGemini(aiPrompt, context);
    setAiResp(resp);
    setAiLoading(false);
    if (USE_SHEETS) await api.post({action:'saveAIHistory', user:user.username, prompt:aiPrompt, response:resp});
  };

  return <PageWrap keyId="reports">
  <div style={{padding:'24px 28px', maxWidth:1400}}>
    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20, flexWrap:'wrap', gap:12}}>
      <div>
        <div style={{fontSize:28, fontWeight:800, color:T.dark, letterSpacing:-0.5}}>📊 รายงานรายละเอียด</div>
        <div style={{fontSize:13, color:T.gray, marginTop:4}}>วิเคราะห์แต่ละแพลตฟอร์มโดยละเอียด</div>
      </div>
      <Btn variant="primary" onClick={()=>{setShowAI(true); setAiResp('');}} icon="🤖">วิเคราะห์ด้วย AI</Btn>
    </div>
    
    {/* Platform tabs */}
    <div style={{display:'flex', gap:8, marginBottom:20, flexWrap:'wrap'}}>
      {PLATFORMS.map(pl => {
        const active = platform === pl.id;
        return <button key={pl.id} onClick={()=>setPlatform(pl.id)} style={{
          padding:'12px 20px', borderRadius:12, border:'none',
          background: active ? pl.bg : 'white',
          color: active ? 'white' : T.gray,
          fontSize:14, fontWeight: active?700:500, cursor:'pointer', fontFamily:'inherit',
          display:'flex', alignItems:'center', gap:8,
          boxShadow: active ? '0 8px 20px rgba(0,0,0,0.15)' : '0 2px 8px rgba(0,0,0,0.04)',
          transition:'all 0.25s cubic-bezier(0.4,0,0.2,1)',
          transform: active ? 'translateY(-2px)' : 'none'
        }}>
          <span style={{fontSize:18}}>{pl.icon}</span>{pl.name}
        </button>;
      })}
    </div>
    
    {/* Platform header */}
    <Card style={{padding:0, overflow:'hidden', marginBottom:20}}>
      <div style={{background: p.bg, padding:'24px 28px', color:'white'}}>
        <div style={{display:'flex', alignItems:'center', gap:16}}>
          <div style={{fontSize:48}}>{p.icon}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:24, fontWeight:800}}>{p.name}</div>
            <div style={{fontSize:13, opacity:0.9, marginTop:2}}>ข้อมูลทั้งหมด {platformEntries.length} บันทึก</div>
          </div>
        </div>
      </div>
      <div style={{padding:'20px 28px', display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))', gap:16}}>

          <div style={{fontSize:11, color:T.gray, marginBottom:4}}>{m.icon} {m.name}</div>
          <div style={{fontSize:22, fontWeight:800, color:T.dark, letterSpacing:-0.5}}>{fmt(totals[m.id])}</div>
        </div>)}

          <div style={{width:32, height:32, borderRadius:10, background:'linear-gradient(135deg,#6c5ce7,#a29bfe)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16}}>🤖</div>
          <div style={{fontWeight:700, fontSize:14}}>Gemini AI</div>

        <div style={{fontSize:13, lineHeight:1.7, whiteSpace:'pre-wrap', color:T.dark}}>{aiResp}</div>

  </div>
  </PageWrap>;
};

    <Modal open={!!viewingContent} onClose={()=>setViewingContent(null)} title={viewingContent?.title} width="600px"
      footer={<React.Fragment>

        <Btn variant="ghost" onClick={()=>setViewingContent(null)}>ปิด</Btn>
        <Btn variant="primary" onClick={()=>{openEdit(viewingContent); setViewingContent(null);}} icon="✏️">แก้ไข</Btn>
      </React.Fragment>}>
      {viewingContent && <React.Fragment>
        {viewingContent.imageUrl && <div style={{width:'100%', height:200, background:'url('+viewingContent.imageUrl+') center/cover', borderRadius:12, marginBottom:16}}/>}
        <div style={{display:'flex', gap:8, marginBottom:16, flexWrap:'wrap'}}>
          <Badge color={PF(viewingContent.platform).color}>{PF(viewingContent.platform).icon} {PF(viewingContent.platform).name}</Badge>
          <Badge color={viewingContent.status==='published'?T.success:T.gray}>{viewingContent.status}</Badge>
          <Badge color={T.info}>{viewingContent.type}</Badge>
          <Badge color={T.gray}>📅 {viewingContent.date}</Badge>
        </div>
        <div style={{fontSize:14, color:T.dark, lineHeight:1.7, marginBottom:16}}>{viewingContent.description||'ไม่มีรายละเอียด'}</div>
        {viewingContent.link && <a href={viewingContent.link} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex', alignItems:'center', gap:6, color:T.primary, fontSize:13, textDecoration:'none', marginBottom:16}}>🔗 {viewingContent.link}</a>}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginTop:16}}>
          <div style={{padding:16, background:T.bg, borderRadius:12}}>
            <div style={{fontSize:11, color:T.gray}}>🤝 Engagement</div>
            <div style={{fontSize:24, fontWeight:800, color:T.dark}}>{fmt(viewingContent.engagement||0)}</div>

/* ═══ MESSAGES / NOTES PAGE — chat + request system ═══ */
const MsgPage = ({user, users, messages, setMessages, toast}) => {
  const [selectedUser, setSelectedUser] = useState(null);
  const [text, setText] = useState('');
  const [type, setType] = useState('message');
  const [requestFor, setRequestFor] = useState('');
  const [showRequest, setShowRequest] = useState(false);
  const chatRef = useRef(null);
  
  const otherUsers = users.filter(u => u.username !== user.username && u.approved);
  
  const conversations = useMemo(() => {
    const map = {};
    messages.forEach(m => {
      const other = m.fromUser === user.username ? m.toUser : (m.toUser === user.username ? m.fromUser : null);
      if (!other) return;
      if (!map[other]) map[other] = [];
      map[other].push(m);
    });
    return map;
  }, [messages, user.username]);
  
  const selectedMsgs = selectedUser ? (conversations[selectedUser] || []).sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt)) : [];
  
  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [selectedMsgs]);
  
  const send = async () => {
    if (!text.trim() || !selectedUser) return;
    const msg = {
      id: Date.now(), fromUser: user.username, toUser: selectedUser,
      message: text, type, requestFor: type === 'request' ? requestFor : '',
      status: type === 'request' ? 'pending' : 'sent',
      createdAt: new Date().toISOString()
    };
    setMessages(prev => [...prev, msg]);
    if (USE_SHEETS) await api.post({action:'sendMessage', ...msg});
    setText(''); setRequestFor(''); setType('message');
    toast('ส่งแล้ว', 'success');
  };
  
  const respondRequest = async (msg, status) => {
    setMessages(prev => prev.map(m => m.id === msg.id ? {...m, status} : m));
    if (USE_SHEETS) await api.post({action:'updateMessageStatus', messageId: msg.id, status});
    toast('อัพเดทสถานะแล้ว', 'success');
  };
  
  return <PageWrap keyId="messages">
  <div style={{padding:'24px 28px', maxWidth:1400}}>
    <div style={{marginBottom:20}}>
      <div style={{fontSize:28, fontWeight:800, color:T.dark, letterSpacing:-0.5}}>💬 ข้อความ & คำขอ</div>
      <div style={{fontSize:13, color:T.gray, marginTop:4}}>ส่งข้อความ ฝากโน้ต หรือขอไฟล์/ทรัพยากรจากทีม</div>
    </div>
    
    <div style={{display:'grid', gridTemplateColumns:'280px 1fr', gap:16, height:'calc(100vh - 200px)', minHeight:500}}>
      {/* User list */}
      <Card style={{padding:0, overflow:'hidden', display:'flex', flexDirection:'column'}}>
        <div style={{padding:'14px 16px', borderBottom:'1px solid '+T.border, fontWeight:700, fontSize:14}}>👥 ผู้ใช้ ({otherUsers.length})</div>
        <div style={{flex:1, overflowY:'auto'}}>
          {otherUsers.map(u => {
            const msgs = conversations[u.username] || [];
            const last = msgs[msgs.length-1];
            const unread = msgs.filter(m => m.toUser === user.username && m.status !== 'read').length;
            const selected = selectedUser === u.username;
            return <div key={u.username} onClick={()=>setSelectedUser(u.username)} style={{
              padding:'12px 16px', borderBottom:'1px solid '+T.border, cursor:'pointer',
              background: selected ? '#f8f7ff' : 'white',
              borderLeft: selected ? '3px solid '+T.primary : '3px solid transparent',
              transition:'all 0.2s', display:'flex', alignItems:'center', gap:10
            }}>
              <div style={{width:38, height:38, borderRadius:'50%', background:'linear-gradient(135deg,#6c5ce7,#a29bfe)', display:'flex', alignItems:'center', justifyContent:'center', color:'white', fontWeight:700, fontSize:14}}>{u.name?.[0]}</div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                  <div style={{fontWeight:600, fontSize:13, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{u.name}</div>
                  {unread > 0 && <div style={{background:T.danger, color:'white', fontSize:10, padding:'2px 6px', borderRadius:10, fontWeight:700}}>{unread}</div>}
                </div>
                <div style={{fontSize:11, color:T.gray, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginTop:2}}>{last?.message || 'ยังไม่มีข้อความ'}</div>
              </div>
            </div>;
          })}
          {otherUsers.length === 0 && <div style={{padding:40, textAlign:'center', color:T.lightGray, fontSize:13}}>ไม่มีผู้ใช้อื่น</div>}
        </div>
      </Card>
      
      {/* Chat area */}
      <Card style={{padding:0, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        {selectedUser ? <React.Fragment>
          <div style={{padding:'14px 20px', borderBottom:'1px solid '+T.border, display:'flex', alignItems:'center', justifyContent:'space-between'}}>
            <div style={{display:'flex', alignItems:'center', gap:10}}>
              <div style={{width:36, height:36, borderRadius:'50%', background:'linear-gradient(135deg,#6c5ce7,#a29bfe)', display:'flex', alignItems:'center', justifyContent:'center', color:'white', fontWeight:700}}>{users.find(u=>u.username===selectedUser)?.name?.[0]}</div>
              <div>
                <div style={{fontWeight:700, fontSize:14}}>{users.find(u=>u.username===selectedUser)?.name}</div>
                <div style={{fontSize:11, color:T.gray}}>@{selectedUser}</div>
              </div>
            </div>
            <Btn variant="outline" size="sm" onClick={()=>setShowRequest(true)} icon="📎">ส่งคำขอ</Btn>
          </div>
          
          <div ref={chatRef} style={{flex:1, overflowY:'auto', padding:20, display:'flex', flexDirection:'column', gap:10, background:'linear-gradient(180deg,#fafafd,#fff)'}}>
            {selectedMsgs.length > 0 ? selectedMsgs.map(m => {
              const isMe = m.fromUser === user.username;
              const isReq = m.type === 'request';
              return <div key={m.id} style={{display:'flex', justifyContent: isMe?'flex-end':'flex-start'}}>
                <div style={{
                  maxWidth:'70%', padding:'12px 16px',
                  borderRadius: isMe?'16px 16px 4px 16px':'16px 16px 16px 4px',
                  background: isMe ? 'linear-gradient(135deg,#6c5ce7,#a29bfe)' : 'white',
                  color: isMe ? 'white' : T.dark,
                  boxShadow:'0 2px 6px rgba(0,0,0,0.05)',
                  animation:'fadeSlideIn 0.3s'
                }}>
                  {isReq && <div style={{fontSize:11, opacity:0.9, marginBottom:6, display:'flex', alignItems:'center', gap:4}}>
                    📎 <strong>คำขอ:</strong> {m.requestFor}
                  </div>}
                  <div style={{fontSize:14, whiteSpace:'pre-wrap'}}>{m.message}</div>
                  <div style={{fontSize:10, marginTop:6, opacity:0.6, textAlign:'right'}}>
                    {new Date(m.createdAt).toLocaleTimeString('th',{hour:'2-digit', minute:'2-digit'})}
                  </div>
                  {isReq && !isMe && m.status === 'pending' && <div style={{display:'flex', gap:6, marginTop:8}}>
                    <button onClick={()=>respondRequest(m, 'approved')} style={{padding:'4px 12px', borderRadius:6, border:'none', background:T.success, color:'white', fontSize:11, cursor:'pointer', fontFamily:'inherit'}}>✓ อนุมัติ</button>
                    <button onClick={()=>respondRequest(m, 'rejected')} style={{padding:'4px 12px', borderRadius:6, border:'none', background:T.danger, color:'white', fontSize:11, cursor:'pointer', fontFamily:'inherit'}}>✕ ปฏิเสธ</button>
                  </div>}
                  {isReq && m.status !== 'pending' && <div style={{marginTop:6}}>
                    <Badge color={m.status==='approved'?T.success:T.danger}>{m.status==='approved'?'✓ อนุมัติแล้ว':'✕ ปฏิเสธแล้ว'}</Badge>
                  </div>}
                </div>
              </div>;
            }) : <div style={{textAlign:'center', color:T.lightGray, padding:40}}>
              <div style={{fontSize:48, marginBottom:8}}>💭</div>
              เริ่มการสนทนากับ {users.find(u=>u.username===selectedUser)?.name}
            </div>}
          </div>
          
          <div style={{padding:14, borderTop:'1px solid '+T.border, background:'white'}}>
            <div style={{display:'flex', gap:8, alignItems:'flex-end'}}>
              <textarea value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); send();}}} placeholder="พิมพ์ข้อความ... (Enter เพื่อส่ง)" rows={1} style={{
                flex:1, padding:'12px 14px', borderRadius:12, border:'1.5px solid #e4e6ea',
                fontSize:14, outline:'none', resize:'none', fontFamily:'inherit', boxSizing:'border-box'
              }}/>
              <Btn variant="primary" onClick={send} icon="📤">ส่ง</Btn>
            </div>
          </div>
        </React.Fragment> : <div style={{flex:1, display:'flex', alignItems:'center', justifyContent:'center', color:T.lightGray}}>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:64, marginBottom:12, opacity:0.4}}>💬</div>
            <div style={{fontSize:16, fontWeight:600, color:T.gray}}>เลือกผู้ใช้เพื่อเริ่มสนทนา</div>
            <div style={{fontSize:13, marginTop:4}}>ส่งข้อความ ฝากโน้ต หรือขอไฟล์</div>
          </div>
        </div>}
      </Card>
    </div>
    
    {/* Request modal */}
    <Modal open={showRequest} onClose={()=>setShowRequest(false)} title="📎 ส่งคำขอ" width="500px"
      footer={<React.Fragment>
        <Btn variant="ghost" onClick={()=>setShowRequest(false)}>ยกเลิก</Btn>
        <Btn variant="primary" onClick={()=>{setType('request'); setShowRequest(false); toast('พิมพ์ข้อความเพิ่มเติมแล้วกดส่ง', 'info');}} icon="✓">ตั้งค่าคำขอ</Btn>
      </React.Fragment>}>
      <div style={{padding:12, background:T.bg, borderRadius:10, marginBottom:16, fontSize:12, color:T.gray}}>
        💡 ระบบคำขอช่วยให้คุณขอไฟล์ ข้อมูล หรือทรัพยากรจากทีมได้ ผู้รับสามารถอนุมัติหรือปฏิเสธได้
      </div>

/* ═══ AI ANALYTICS PAGE — with content selection ═══ */
const AIPage = ({user, entries, metrics, contents, toast}) => {
  const [selectedContent, setSelectedContent] = useState(null);
  const [prompt, setPrompt] = useState('');
  const [action, setAction] = useState('analyze');
  const [response, setResponse] = useState('');
  const [loading, setLoading] = useState(false);
  
  const actions = [
    {id:'analyze', label:'วิเคราะห์ผลงาน', icon:'🔍', prompt:'วิเคราะห์คอนเทนต์นี้ในเชิงลึก จุดแข็ง จุดอ่อน และแนะนำวิธีปรับปรุง'},
    {id:'improve', label:'แนะนำการพัฒนา', icon:'✨', prompt:'แนะนำวิธีพัฒนาคอนเทนต์นี้ให้ดีขึ้น ทั้งเนื้อหา การนำเสนอ และการกระจาย'},
    {id:'rewrite', label:'เขียนใหม่', icon:'✍️', prompt:'ช่วยเขียนคอนเทนต์นี้ใหม่ให้น่าสนใจและดึงดูดผู้อ่านมากขึ้น'},
    {id:'hashtag', label:'สร้าง Hashtag', icon:'#️⃣', prompt:'สร้าง hashtag ที่เหมาะสมสำหรับคอนเทนต์นี้ (10-15 tags)'},
    {id:'caption', label:'สร้าง Caption', icon:'📝', prompt:'ช่วยเขียน caption ที่น่าสนใจสำหรับคอนเทนต์นี้ 3 แบบ ให้เลือก'},
    {id:'schedule', label:'แนะนำเวลาโพสต์', icon:'⏰', prompt:'แนะนำเวลาที่ดีที่สุดในการโพสต์คอนเทนต์นี้ตามกลุ่มเป้าหมาย'},
  ];
  
  const runAI = async () => {
    const finalPrompt = prompt || actions.find(a => a.id === action)?.prompt;

    let context = '';
    if (selectedContent) {
      const c = contents.find(x => x.id === selectedContent);
      if (c) context = `คอนเทนต์:\nหัวข้อ: ${c.title}\nแพลตฟอร์ม: ${PF(c.platform).name}\nประเภท: ${c.type}\nสถานะ: ${c.status}\nรายละเอียด: ${c.description||'-'}\nEngagement: ${c.engagement||0}\nReach: ${c.reach||0}`;
    }
    const resp = await askGemini(finalPrompt, context);
    setResponse(resp);
    setLoading(false);
    if (USE_SHEETS) await api.post({action:'saveAIHistory', user:user.username, prompt:finalPrompt, response:resp, contentId:selectedContent||''});
  };
  
  return <PageWrap keyId="ai">
  <div style={{padding:'24px 28px', maxWidth:1200}}>
    <div style={{marginBottom:24}}>
      <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:6}}>

          padding:12, borderRadius:10, cursor:'pointer',
          border: selectedContent===c.id ? '2px solid '+T.primary : '2px solid '+T.border,

/* ═══ ADMIN PAGE — user & permission management with modals ═══ */
const AdminPage = ({user, users, setUsers, requests, setRequests, toast}) => {
  const [approvingReq, setApprovingReq] = useState(null);
  const [editingUser, setEditingUser] = useState(null);
  const [tmpPerms, setTmpPerms] = useState([]);
  const [tmpRole, setTmpRole] = useState('viewer');
  
  const openApprove = (req) => {
    setApprovingReq(req);
    setTmpPerms(['view_dashboard']);
    setTmpRole('viewer');
  };
  const openEdit = (u) => {
    setEditingUser(u);
    setTmpPerms([...(u.permissions||[])]);
    setTmpRole(u.role);
  };
  
  const doApprove = async () => {
    if (tmpPerms.length === 0) { toast('เลือกสิทธิ์อย่างน้อย 1 อย่าง', 'error'); return; }
    const newUser = {
      id: Date.now(), username: approvingReq.username, password: approvingReq.password,
      name: approvingReq.name, role: tmpRole, approved: true, permissions: tmpPerms
    };
    setUsers(prev => [...prev, newUser]);
    setRequests(prev => prev.filter(r => r.id !== approvingReq.id));
    if (USE_SHEETS) await api.post({
      action:'approveRequest', requestId: approvingReq.id,
      permissions: tmpPerms, role: tmpRole, adminUser: user.username
    });
    setApprovingReq(null);
    toast('อนุมัติสำเร็จและกำหนดสิทธิ์แล้ว', 'success');
  };
  
  const doReject = async (req) => {
    setRequests(prev => prev.filter(r => r.id !== req.id));
    if (USE_SHEETS) await api.post({action:'rejectRequest', requestId: req.id, adminUser: user.username});
    toast('ปฏิเสธคำขอแล้ว', 'info');
  };
  
  const saveEdit = async () => {
    setUsers(prev => prev.map(u => u.id === editingUser.id ? {...u, role: tmpRole, permissions: tmpPerms} : u));
    if (USE_SHEETS) await api.post({
      action:'updateUserPermissions', userId: editingUser.id,
      role: tmpRole, permissions: tmpPerms, adminUser: user.username
    });
    setEditingUser(null);
    toast('บันทึกสิทธิ์แล้ว', 'success');
  };
  
  const delUser = async (u) => {
    if (u.id === 1) { toast('ลบ Admin ไม่ได้', 'error'); return; }
    if (!confirm('ยืนยันการลบผู้ใช้ '+u.name+'?')) return;
    setUsers(prev => prev.filter(x => x.id !== u.id));
    if (USE_SHEETS) await api.post({action:'deleteUser', userId: u.id, adminUser: user.username});
    toast('ลบแล้ว', 'success');
  };
  
  const togglePerm = (pid) => setTmpPerms(p => p.includes(pid) ? p.filter(x => x !== pid) : [...p, pid]);
  
  return <PageWrap keyId="admin">
  <div style={{padding:'24px 28px', maxWidth:1200}}>
    <div style={{marginBottom:24}}>
      <div style={{fontSize:28, fontWeight:800, color:T.dark, letterSpacing:-0.5}}>⚙️ จัดการผู้ใช้และสิทธิ์</div>
      <div style={{fontSize:13, color:T.gray, marginTop:4}}>อนุมัติผู้ใช้ใหม่ และกำหนดสิทธิ์การเข้าถึงฟังก์ชัน</div>
    </div>
    
    {/* Pending requests */}
    {requests.length > 0 && <Card style={{background:'linear-gradient(135deg,#fff8e1,#fffde7)', border:'1px solid #ffc107', marginBottom:20}}>
      <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16}}>
        <div style={{width:40, height:40, borderRadius:12, background:'#ffc107', display:'flex', alignItems:'center', justifyContent:'center', fontSize:20}}>📋</div>
        <div>
          <div style={{fontWeight:700, fontSize:16, color:'#856404'}}>คำขอเข้าใช้บริการ ({requests.length})</div>
          <div style={{fontSize:12, color:'#856404'}}>กดอนุมัติเพื่อกำหนดสิทธิ์การเข้าถึง</div>
        </div>
      </div>
      <div style={{display:'grid', gap:8}}>
        {requests.map(req => <div key={req.id} style={{background:'white', padding:'14px 18px', borderRadius:12, display:'flex', alignItems:'center', justifyContent:'space-between', boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
          <div style={{display:'flex', alignItems:'center', gap:12}}>
            <div style={{width:40, height:40, borderRadius:'50%', background:'#fff3cd', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, fontWeight:700, color:'#856404'}}>{req.name?.[0]}</div>
            <div>
              <div style={{fontWeight:600}}>{req.name}</div>
              <div style={{fontSize:12, color:T.gray}}>@{req.username}</div>
            </div>
          </div>
          <div style={{display:'flex', gap:8}}>
            <Btn variant="success" size="sm" onClick={()=>openApprove(req)} icon="✓">อนุมัติ + กำหนดสิทธิ์</Btn>
            <Btn variant="danger" size="sm" onClick={()=>doReject(req)} icon="✕">ปฏิเสธ</Btn>
          </div>
        </div>)}
      </div>
    </Card>}
    
    {/* User list */}
    <Card style={{padding:0}}>
      <div style={{padding:'16px 20px', borderBottom:'1px solid '+T.border, display:'flex', alignItems:'center', justifyContent:'space-between'}}>
        <div style={{fontWeight:700, fontSize:16}}>👥 ผู้ใช้ทั้งหมด ({users.length})</div>
      </div>
      {users.map(u => <div key={u.id} style={{padding:'16px 20px', borderBottom:'1px solid '+T.border, display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:12}}>
        <div style={{display:'flex', alignItems:'center', gap:12, flex:1, minWidth:200}}>
          <div style={{width:44, height:44, borderRadius:'50%', background: u.role==='admin' ? 'linear-gradient(135deg,#6c5ce7,#a29bfe)' : '#dfe6e9', display:'flex', alignItems:'center', justifyContent:'center', color: u.role==='admin'?'white':T.gray, fontWeight:700, fontSize:16}}>{u.name?.[0]}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:600, fontSize:14}}>{u.name} {u.role==='admin' && <Badge color={T.primary}>Admin</Badge>}</div>
            <div style={{fontSize:12, color:T.gray}}>@{u.username}</div>
            <div style={{display:'flex', gap:4, flexWrap:'wrap', marginTop:6}}>
              {(u.permissions||[]).slice(0,4).map(pid => {
                const p = PERMS.find(x=>x.id===pid);
                return p ? <Badge key={pid} color={T.gray} bg={T.bg}>{p.icon} {p.label}</Badge> : null;
              })}
              {u.permissions?.length > 4 && <Badge color={T.gray} bg={T.bg}>+{u.permissions.length-4}</Badge>}
            </div>
          </div>
        </div>
        <div style={{display:'flex', gap:8}}>
          <Btn variant="outline" size="sm" onClick={()=>openEdit(u)} icon="✏️">แก้ไขสิทธิ์</Btn>
          {u.id !== 1 && <Btn variant="danger" size="sm" onClick={()=>delUser(u)} icon="🗑">ลบ</Btn>}
        </div>
      </div>)}
    </Card>
    
    {/* Approve modal */}
    <Modal open={!!approvingReq} onClose={()=>setApprovingReq(null)} title={`✅ อนุมัติ ${approvingReq?.name}`} width="600px"
      footer={<React.Fragment>
        <Btn variant="ghost" onClick={()=>setApprovingReq(null)}>ยกเลิก</Btn>
        <Btn variant="success" onClick={doApprove} icon="✓">อนุมัติและกำหนดสิทธิ์</Btn>
      </React.Fragment>}>
      <div style={{padding:12, background:'#fff8e1', borderRadius:10, marginBottom:16, fontSize:12, color:'#856404'}}>
        ⚠️ ต้องกำหนดสิทธิ์อย่างน้อย 1 อย่างก่อนอนุมัติ
      </div>
      <Select label="Role" value={tmpRole} onChange={e=>setTmpRole(e.target.value)}
        options={[{value:'viewer',label:'👁 Viewer'},{value:'editor',label:'✏️ Editor'},{value:'admin',label:'⚙️ Admin'}]}/>
      <div style={{fontWeight:600, fontSize:13, marginBottom:10, marginTop:6}}>กำหนดสิทธิ์การเข้าถึง:</div>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
        {PERMS.map(p => <label key={p.id} style={{
          display:'flex', alignItems:'center', gap:10, padding:'10px 14px',
          borderRadius:10, cursor:'pointer',
          background: tmpPerms.includes(p.id) ? 'rgba(108,92,231,0.08)' : T.bg,
          border: tmpPerms.includes(p.id) ? '2px solid '+T.primary : '2px solid transparent',
          transition:'all 0.2s'
        }}>
          <input type="checkbox" checked={tmpPerms.includes(p.id)} onChange={()=>togglePerm(p.id)} style={{width:18, height:18, accentColor:T.primary, cursor:'pointer'}}/>
          <span style={{fontSize:13, fontWeight: tmpPerms.includes(p.id)?600:400, color: tmpPerms.includes(p.id)?T.primary:T.dark}}>{p.icon} {p.label}</span>
        </label>)}
      </div>
    </Modal>
    
    {/* Edit permissions modal */}
    <Modal open={!!editingUser} onClose={()=>setEditingUser(null)} title={`✏️ แก้ไขสิทธิ์ ${editingUser?.name}`} width="600px"
      footer={<React.Fragment>
        <Btn variant="ghost" onClick={()=>setEditingUser(null)}>ยกเลิก</Btn>
        <Btn variant="primary" onClick={saveEdit} icon="💾">บันทึก</Btn>
      </React.Fragment>}>
      <Select label="Role" value={tmpRole} onChange={e=>setTmpRole(e.target.value)}
        options={[{value:'viewer',label:'👁 Viewer'},{value:'editor',label:'✏️ Editor'},{value:'admin',label:'⚙️ Admin'}]}/>
      <div style={{fontWeight:600, fontSize:13, marginBottom:10, marginTop:6}}>สิทธิ์การเข้าถึง:</div>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
        {PERMS.map(p => <label key={p.id} style={{
          display:'flex', alignItems:'center', gap:10, padding:'10px 14px',
          borderRadius:10, cursor:'pointer',
          background: tmpPerms.includes(p.id) ? 'rgba(108,92,231,0.08)' : T.bg,
          border: tmpPerms.includes(p.id) ? '2px solid '+T.primary : '2px solid transparent',
          transition:'all 0.2s'
        }}>
          <input type="checkbox" checked={tmpPerms.includes(p.id)} onChange={()=>togglePerm(p.id)} style={{width:18, height:18, accentColor:T.primary, cursor:'pointer'}}/>
          <span style={{fontSize:13, fontWeight: tmpPerms.includes(p.id)?600:400, color: tmpPerms.includes(p.id)?T.primary:T.dark}}>{p.icon} {p.label}</span>
        </label>)}
      </div>
    </Modal>
  </div>
  </PageWrap>;
};

/* ═══ MAIN APP ═══ */
function App() {
  const [user, setUser] = useState(null);
  const [users, setUsers] = useState(INIT_USERS);
  const [page, setPage] = useState('dashboard');
  const [collapsed, setCollapsed] = useState(false);
  const [metrics, setMetrics] = useState(DEFAULT_METRICS);
  const [entries, setEntries] = useState([]);
  const [contents, setContents] = useState([]);
  const [messages, setMessages] = useState([]);
  const [requests, setRequests] = useState([]);
  const {show: toast, Toaster} = useToast();
  
  // Load data from Google Sheets
  const loadAll = async () => {
    if (!USE_SHEETS) return;
    try {
      const [u, m, e, c, msg, r] = await Promise.all([
        api.get('getUsers'), api.get('getMetrics'), api.get('getEntries'),
        api.get('getContent'), api.get('getMessages'), api.get('getRequests')
      ]);
      if (Array.isArray(u) && u.length > 0) setUsers(u);
      if (Array.isArray(m) && m.length > 0) setMetrics(m);
      if (Array.isArray(e)) setEntries(e);
      if (Array.isArray(c)) setContents(c);
      if (Array.isArray(msg)) setMessages(msg);
      if (Array.isArray(r)) setRequests(r);
    } catch(err) { console.error('Load error:', err); }
  };
  
  useEffect(() => { loadAll(); }, []);
  
  if (!user) return <React.Fragment>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <LoginPage users={users} onLogin={u => {setUser(u); loadAll();}} onRequestAccess={r => setRequests(p => [...p, {...r, id:Date.now()}])} toast={toast}/>
    <Toaster/>
  </React.Fragment>;
  
  const hasPerm = (p) => user.role === 'admin' || user.permissions?.includes(p);
  const sw = collapsed ? 72 : 240;
  
  return <div style={{fontFamily:"'Prompt','Noto Sans Thai',sans-serif", minHeight:'100vh', background:T.bg}}>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <Sidebar page={page} setPage={setPage} user={user} onLogout={()=>setUser(null)} co={collapsed} setCo={setCollapsed}/>
    <div style={{marginLeft:sw, transition:'margin-left 0.3s cubic-bezier(0.4,0,0.2,1)', minHeight:'100vh'}}>
      {/* Top bar */}
      <div style={{background:'white', padding:'14px 28px', borderBottom:'1px solid '+T.border, display:'flex', justifyContent:'space-between', alignItems:'center', position:'sticky', top:0, zIndex:50, backdropFilter:'blur(8px)'}}>
        <div style={{display:'flex', gap:8, alignItems:'center'}}>
          <div style={{fontSize:11, color:T.gray}}>
            {USE_SHEETS ? <span style={{color:T.success}}>🟢 Google Sheets</span> : <span style={{color:T.warning}}>🟡 Demo Mode</span>}
            {' • '}
            {USE_GEMINI ? <span style={{color:T.success}}>🟢 Gemini AI</span> : <span style={{color:T.warning}}>🟡 No AI</span>}
          </div>
        </div>
        <div style={{display:'flex', alignItems:'center', gap:14}}>
          {requests.length > 0 && user.role === 'admin' && <button onClick={()=>setPage('admin')} style={{position:'relative', background:'none', border:'none', cursor:'pointer', fontSize:20, padding:6, borderRadius:8}}>
            🔔
            <span style={{position:'absolute', top:0, right:0, background:T.danger, color:'white', fontSize:9, padding:'2px 6px', borderRadius:20, fontWeight:700}}>{requests.length}</span>
          </button>}
          <div style={{display:'flex', alignItems:'center', gap:10, padding:'6px 12px', borderRadius:12, background:T.bg}}>
            <div style={{width:32, height:32, borderRadius:'50%', background:'linear-gradient(135deg,#6c5ce7,#a29bfe)', display:'flex', alignItems:'center', justifyContent:'center', color:'white', fontWeight:700, fontSize:13}}>{user.name?.[0]}</div>
            <div><div style={{fontSize:13, fontWeight:600}}>{user.name}</div><div style={{fontSize:10, color:T.gray}}>{user.role}</div></div>
          </div>
        </div>
      </div>
      
      {/* Pages */}
      {page==='dashboard' && hasPerm('view_dashboard') && <DashPage entries={entries} metrics={metrics}/>}
      {page==='data' && hasPerm('edit_data') && <DataPage user={user} entries={entries} setEntries={setEntries} metrics={metrics} setMetrics={setMetrics} toast={toast} reload={loadAll}/>}
      {page==='reports' && hasPerm('view_reports') && <RepPage user={user} entries={entries} metrics={metrics} toast={toast}/>}
      {page==='content' && hasPerm('manage_content') && <ConPage user={user} contents={contents} setContents={setContents} toast={toast}/>}
      {page==='messages' && hasPerm('view_messages') && <MsgPage user={user} users={users} messages={messages} setMessages={setMessages} toast={toast}/>}
      {page==='ai' && hasPerm('ai_analytics') && <AIPage user={user} entries={entries} metrics={metrics} contents={contents} toast={toast}/>}
      {page==='admin' && hasPerm('manage_users') && <AdminPage user={user} users={users} setUsers={setUsers} requests={requests} setRequests={setRequests} toast={toast}/>}
    </div>
    <Toaster/>
    <style>{`
      @keyframes sp { to { transform: rotate(360deg); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
      @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      @keyframes modalOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.95); } }
      @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes shakeX { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
      @keyframes drift { 0% { transform: translate(0,0); } 100% { transform: translate(20px, -20px); } }
      @keyframes bobble { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
      body { margin: 0; -webkit-font-smoothing: antialiased; }
      * { box-sizing: border-box; }
    `}</style>
  </div>;
}

class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  render(){
    if(this.state.hasError) return React.createElement('div',{style:{padding:60,textAlign:'center',fontFamily:"'Prompt',sans-serif"}},
      React.createElement('div',{style:{fontSize:48,marginBottom:16}},'⚠️'),
      React.createElement('div',{style:{fontSize:18,fontWeight:700,marginBottom:8}},'เกิดข้อผิดพลาด'),
      React.createElement('div',{style:{fontSize:14,color:'#636e72',marginBottom:16}},String(this.state.error?.message||'')),
      React.createElement('button',{onClick:function(){location.reload();},style:{padding:'12px 32px',borderRadius:10,border:'none',background:'#6c5ce7',color:'white',fontSize:14,cursor:'pointer'}},'🔄 โหลดใหม่')
    );
    return this.props.children;
  }
}
ReactDOM.render(React.createElement(ErrorBoundary,null,React.createElement(App)),document.getElementById('root'));
</script>
</body>
</html>
