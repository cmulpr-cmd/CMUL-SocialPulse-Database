function initApp(){

const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxnNG4mr7hVsHUcLpBgdYtK_2-D71S-YKXg5ANujqpPeifaP3NHFP4jDCph87HP1YEJYw/exec';
// ตัวอย่าง: const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx.../exec';

const USE_SHEETS = GOOGLE_SCRIPT_URL !== 'https://script.google.com/macros/s/AKfycbxnNG4mr7hVsHUcLpBgdYtK_2-D71S-YKXg5ANujqpPeifaP3NHFP4jDCph87HP1YEJYw/exec';

/* ═══ API ═══ */
const api = {
  async post(data) {
    if (!USE_SHEETS) return null;
    try {
      const r = await fetch(GOOGLE_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(data) });
      return await r.json();
    } catch(e) { console.error('API error:', e); return null; }
  },
  async get(action, params={}) {
    if (!USE_SHEETS) return null;
    try {
      const url = new URL(GOOGLE_SCRIPT_URL);
      url.searchParams.set('action', action);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
      const r = await fetch(url.toString());
      return await r.json();
    } catch(e) { console.error('API error:', e); return null; }
  }
};

/* ═══ DEMO DATA ═══ */
function genDemoData(metrics) {
  const data = [];
  const now = new Date();
  for (let d = 30; d >= 0; d--) {
    const date = new Date(now);
    date.setDate(date.getDate() - d);
    const dateStr = date.toISOString().split('T')[0];
    PLATFORMS.forEach(p => {
      const entry = { date: dateStr, platform: p.id };
      metrics.forEach(m => {
        const base = m.id === 'followers' ? 50000 + Math.random()*100000 :
                     m.id === 'reach' ? 10000 + Math.random()*50000 :
                     m.id === 'engagement' ? 1000 + Math.random()*10000 :
                     500 + Math.random()*5000;
        entry[m.id] = Math.round(base * (1 + (30-d)*0.01));
      });
      data.push(entry);
    });
  }
  return data;
}

    <style>{`@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(20px,-20px)}}@keyframes bobble{0%{transform:translateY(0)}100%{transform:translateY(-6px)}}@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}@keyframes fadeInUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}input::placeholder{color:rgba(255,255,255,0.25)}`}</style>
  </div>;
};

    </div>
    <div style={{flex:1,padding:'12px 8px',overflowY:'auto'}}>{items.map(i=><button key={i.id} onClick={()=>setPage(i.id)} style={{width:'100%',padding:co?'12px 0':'10px 14px',borderRadius:10,border:'none',background:page===i.id?'linear-gradient(135deg,#6c5ce7,#a29bfe)':'transparent',color:page===i.id?'white':'rgba(255,255,255,0.55)',fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',gap:10,marginBottom:2,textAlign:'left'}} onMouseOver={e=>{if(page!==i.id)e.currentTarget.style.background='rgba(108,92,231,0.15)';}} onMouseOut={e=>{if(page!==i.id)e.currentTarget.style.background='transparent';}}><span style={{fontSize:18,minWidth:co?'100%':24,textAlign:'center'}}>{i.icon}</span>{!co && <span style={{fontWeight:page===i.id?600:400}}>{i.label}</span>}</button>)}</div>

      {!co && <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}><div style={{width:36,height:36,borderRadius:'50%',background:'linear-gradient(135deg,#6c5ce7,#a29bfe)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:700}}>{user.name?.[0]}</div><div><div style={{fontSize:13,fontWeight:600}}>{user.name}</div><div style={{fontSize:11,color:'rgba(255,255,255,0.4)'}}>{user.role}</div></div></div>}
      <button onClick={onLogout} style={{width:'100%',padding:8,borderRadius:8,border:'1px solid rgba(255,255,255,0.1)',background:'transparent',color:'rgba(255,255,255,0.5)',fontSize:12,cursor:'pointer'}}>{co?'🚪':'🚪 ออกจากระบบ'}</button>

/* ═══ PAGE: DASHBOARD — ดูได้ทุก role, กรองรายวัน/เดือน/ปี ═══ */
const DashPage = ({entries, metrics, viewMode, setViewMode}) => {
  const agg = useMemo(() => {
    const result = {};
    PLATFORMS.forEach(p => { result[p.id] = {}; metrics.forEach(m => { result[p.id][m.id] = 0; }); });
    const now = new Date();
    entries.forEach(e => {
      const d = new Date(e.date);
      let include = false;
      if (viewMode === 'day') include = e.date === today();
      else if (viewMode === 'month') include = d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      else if (viewMode === 'year') include = d.getFullYear() === now.getFullYear();
      else include = true;
      if (include && result[e.platform]) {
        metrics.forEach(m => { if (e[m.id] !== undefined) result[e.platform][m.id] += Number(e[m.id]) || 0; });
      }
    });
    return result;
  }, [entries, metrics, viewMode]);

  const chartData = useMemo(() => {
    const byDate = {};
    entries.forEach(e => {
      if (!byDate[e.date]) byDate[e.date] = {};
      PLATFORMS.forEach(p => { if (!byDate[e.date][p.id]) byDate[e.date][p.id] = 0; });
      if (e.platform) byDate[e.date][e.platform] = (byDate[e.date][e.platform]||0) + (Number(e.engagement)||Number(e.reach)||0);
    });
    return Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).slice(-14).map(([d,v])=>({name:d.slice(5),...v}));
  }, [entries]);

  const viewLabels = {day:'วันนี้',month:'เดือนนี้',year:'ปีนี้',all:'ทั้งหมด'};

  return <div style={{padding:'24px 28px',maxWidth:1400}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div><div style={{fontSize:24,fontWeight:800,color:'#1a1a2e'}}>📊 ภาพรวมข้อมูลทั้งหมด</div><div style={{fontSize:13,color:'#636e72',marginTop:4}}>ติดตามผลการดำเนินงานทุกช่องทาง</div></div>
      <div style={{display:'flex',gap:8}}>{Object.entries(viewLabels).map(([k,v])=><button key={k} onClick={()=>setViewMode(k)} style={{padding:'8px 16px',borderRadius:8,border:'none',background:viewMode===k?'#6c5ce7':'#f0f0f5',color:viewMode===k?'white':'#636e72',fontSize:13,cursor:'pointer',fontWeight:viewMode===k?600:400}}>{v}</button>)}</div>
    </div>

    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:16,marginBottom:24}}>
      {PLATFORMS.map(p => <div key={p.id} style={{...S.card,padding:'20px'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}><div style={S.pI(p.color)}>{p.icon}</div><div style={{fontWeight:700,fontSize:16}}>{p.name}</div></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {metrics.slice(0,4).map(m => <div key={m.id} style={{padding:'8px 10px',background:'#f8f7ff',borderRadius:8}}>
            <div style={{fontSize:10,color:'#b2bec3'}}>{m.icon} {m.name}</div>
            <div style={{fontSize:18,fontWeight:800,color:'#2d3436'}}>{fN(agg[p.id]?.[m.id] || 0)}</div>
            <div style={{fontSize:10,color:'#b2bec3'}}>{m.unit}</div>
          </div>)}
        </div>
        {metrics.length > 4 && <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:10}}>
          {metrics.slice(4).map(m => <div key={m.id} style={{padding:'6px 10px',background:'#fafafa',borderRadius:6}}>
            <div style={{fontSize:10,color:'#b2bec3'}}>{m.icon} {m.name}</div>
            <div style={{fontSize:14,fontWeight:700}}>{fN(agg[p.id]?.[m.id] || 0)}</div>
          </div>)}
        </div>}
      </div>)}
    </div>

    {chartData.length > 0 && <div style={S.card}>
      <div style={{fontWeight:700,fontSize:16,marginBottom:16}}>แนวโน้ม 14 วันล่าสุด</div>
      <ResponsiveContainer width="100%" height={250}>
        <LineChart data={chartData}>
          <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f5"/>
          <XAxis dataKey="name" tick={{fontSize:11,fill:'#b2bec3'}}/>
          <YAxis tick={{fontSize:11,fill:'#b2bec3'}} tickFormatter={v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':v}/>
          <Tooltip formatter={v=>fN(v)}/>
          {PLATFORMS.map(p=><Line key={p.id} type="monotone" dataKey={p.id} stroke={p.color} strokeWidth={2} dot={false} name={p.name}/>)}
        </LineChart>
      </ResponsiveContainer>
    </div>}
  </div>;
};

/* ═══ PAGE: DATA ENTRY — สร้างตัวชี้วัดใหม่ + กรอกรายวัน/เดือน/ปี ═══ */
const DataPage = ({entries, setEntries, metrics, setMetrics}) => {
  const [selPlat, setSelPlat] = useState('facebook');
  const [selDate, setSelDate] = useState(today());
  const [values, setValues] = useState({});
  const [saved, setSaved] = useState(false);
  const [showNewMetric, setShowNew] = useState(false);
  const [newMetric, setNewMetric] = useState({name:'',unit:'ครั้ง',icon:'📊'});
  const [viewTab, setViewTab] = useState('entry');
  const [histPlat, setHistPlat] = useState('facebook');

  const loadExisting = (plat, date) => {
    const existing = entries.find(e => e.platform === plat && e.date === date);
    if (existing) {
      const v = {};
      metrics.forEach(m => { v[m.id] = existing[m.id] || ''; });
      setValues(v);
    } else {
      const v = {};
      metrics.forEach(m => { v[m.id] = ''; });
      setValues(v);
    }
  };

  useEffect(() => { loadExisting(selPlat, selDate); }, [selPlat, selDate, metrics]);

  const saveData = async () => {
    const entry = { date: selDate, platform: selPlat, ...values };
    setEntries(prev => {
      const idx = prev.findIndex(e => e.platform === selPlat && e.date === selDate);
      if (idx >= 0) { const n = [...prev]; n[idx] = entry; return n; }
      return [...prev, entry];
    });
    if (USE_SHEETS) await api.post({ action:'saveEntry', ...entry });
    setSaved(true); setTimeout(() => setSaved(false), 2000);
  };

  const addMetric = () => {
    if (!newMetric.name) return;
    const id = 'custom_' + Date.now();
    setMetrics(prev => [...prev, { id, ...newMetric }]);
    setNewMetric({name:'',unit:'ครั้ง',icon:'📊'});
    setShowNew(false);
  };

  const delMetric = (id) => {
    if (DEFAULT_METRICS.find(m=>m.id===id)) return;
    setMetrics(prev => prev.filter(m => m.id !== id));
  };

  const historyData = useMemo(() => {
    return entries.filter(e => e.platform === histPlat).sort((a,b) => b.date.localeCompare(a.date));
  }, [entries, histPlat]);

  return <div style={{padding:'24px 28px',maxWidth:1200}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20,flexWrap:'wrap',gap:12}}>
      <div><div style={{fontSize:22,fontWeight:800}}>📝 กรอกข้อมูล</div><div style={{fontSize:13,color:'#b2bec3'}}>บันทึกข้อมูลตัวชี้วัดรายวัน และสร้างตัวชี้วัดใหม่</div></div>
      <div style={{display:'flex',gap:8}}>
        {['entry','history','metrics'].map(t=><button key={t} onClick={()=>setViewTab(t)} style={{padding:'8px 16px',borderRadius:8,border:'none',background:viewTab===t?'#6c5ce7':'#f0f0f5',color:viewTab===t?'white':'#636e72',fontSize:13,cursor:'pointer',fontWeight:viewTab===t?600:400}}>{{entry:'กรอกข้อมูล',history:'ประวัติ',metrics:'ตัวชี้วัด'}[t]}</button>)}
      </div>
    </div>

    {viewTab === 'entry' && <div style={S.card}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}}>
        <div>
          <label style={{fontSize:12,color:'#b2bec3',display:'block',marginBottom:4}}>แพลตฟอร์ม</label>
          <select value={selPlat} onChange={e=>setSelPlat(e.target.value)} style={{...S.input}}>
            {PLATFORMS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
        <div>
          <label style={{fontSize:12,color:'#b2bec3',display:'block',marginBottom:4}}>วันที่</label>
          <input type="date" value={selDate} onChange={e=>setSelDate(e.target.value)} style={S.input}/>
        </div>
      </div>
      <div style={{fontSize:14,fontWeight:600,color:'#6c5ce7',marginBottom:12}}>ตัวชี้วัด ({metrics.length} รายการ)</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:12,marginBottom:20}}>
        {metrics.map(m=><div key={m.id}>
          <label style={{fontSize:12,color:'#636e72',display:'block',marginBottom:4}}>{m.icon} {m.name} ({m.unit})</label>
          <input type="number" value={values[m.id]||''} onChange={e=>setValues(prev=>({...prev,[m.id]:e.target.value}))} placeholder="0" style={{...S.input,border:'2px solid #6c5ce7',background:'#f8f7ff'}}/>
        </div>)}
      </div>
      {saved && <div style={{background:'#d4edda',color:'#155724',padding:'12px 20px',borderRadius:10,marginBottom:16,fontWeight:600,animation:'fadeInUp 0.3s'}}>✅ บันทึกข้อมูลวันที่ {selDate} สำเร็จ!</div>}
      <button onClick={saveData} style={S.btn('linear-gradient(135deg,#6c5ce7,#a29bfe)')}>💾 บันทึกข้อมูล</button>
    </div>}

    {viewTab === 'history' && <div style={S.card}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:16}}>📜 ประวัติการกรอกข้อมูล</div>
        <select value={histPlat} onChange={e=>setHistPlat(e.target.value)} style={S.sel}>{PLATFORMS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
      </div>
      <div style={{overflow:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr><th style={S.th}>วันที่</th>{metrics.map(m=><th key={m.id} style={S.th}>{m.icon} {m.name}</th>)}</tr></thead>
          <tbody>{historyData.length>0 ? historyData.map((e,i)=><tr key={i}><td style={S.td}>{e.date}</td>{metrics.map(m=><td key={m.id} style={{...S.td,fontWeight:600}}>{fN(Number(e[m.id])||0)}</td>)}</tr>) : <tr><td colSpan={metrics.length+1} style={{...S.td,textAlign:'center',padding:40,color:'#b2bec3'}}>ยังไม่มีข้อมูล — ไปแท็บ "กรอกข้อมูล" เพื่อเริ่มบันทึก</td></tr>}</tbody>
        </table>
      </div>
    </div>}

    {viewTab === 'metrics' && <div style={S.card}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div><div style={{fontWeight:700,fontSize:16}}>📐 จัดการตัวชี้วัด</div><div style={{fontSize:12,color:'#b2bec3'}}>สร้างตัวชี้วัดใหม่ เช่น ยอด Engagement, ผู้ติดตาม ฯลฯ</div></div>
        <button onClick={()=>setShowNew(true)} style={S.btn('#6c5ce7')}>+ สร้างตัวชี้วัดใหม่</button>
      </div>
      {showNewMetric && <div style={{background:'#f8f7ff',borderRadius:12,padding:16,marginBottom:16,animation:'fadeInUp 0.3s'}}>
        <div style={{fontWeight:600,marginBottom:12}}>✨ สร้างตัวชี้วัดใหม่</div>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr',gap:12,marginBottom:12}}>
          <div><label style={{fontSize:11,color:'#b2bec3',display:'block',marginBottom:4}}>ชื่อตัวชี้วัด</label><input value={newMetric.name} onChange={e=>setNewMetric(p=>({...p,name:e.target.value}))} style={S.input} placeholder="เช่น ยอดขาย, จำนวนสมาชิก..."/></div>
          <div><label style={{fontSize:11,color:'#b2bec3',display:'block',marginBottom:4}}>หน่วย</label><input value={newMetric.unit} onChange={e=>setNewMetric(p=>({...p,unit:e.target.value}))} style={S.input} placeholder="ครั้ง, คน, บาท..."/></div>
          <div><label style={{fontSize:11,color:'#b2bec3',display:'block',marginBottom:4}}>ไอคอน</label><input value={newMetric.icon} onChange={e=>setNewMetric(p=>({...p,icon:e.target.value}))} style={S.input} placeholder="📊"/></div>
        </div>
        <div style={{display:'flex',gap:8}}><button onClick={addMetric} style={S.btn('#00b894')}>✅ เพิ่ม</button><button onClick={()=>setShowNew(false)} style={S.btnO('#636e72')}>ยกเลิก</button></div>
      </div>}
      <div style={{display:'grid',gap:8}}>
        {metrics.map(m => <div key={m.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',borderRadius:10,border:'1px solid #f0f0f5'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:20}}>{m.icon}</span><div><div style={{fontWeight:600,fontSize:14}}>{m.name}</div><div style={{fontSize:11,color:'#b2bec3'}}>หน่วย: {m.unit} · ID: {m.id}</div></div></div>
          {!DEFAULT_METRICS.find(x=>x.id===m.id) ? <button onClick={()=>delMetric(m.id)} style={S.btnO('#e17055')}>🗑️ ลบ</button> : <span style={S.badge('#f0f0f5','#b2bec3')}>ค่าเริ่มต้น</span>}
        </div>)}
      </div>
    </div>}
  </div>;
};

/* ═══ PAGE: REPORTS ═══ */
const RepPage = ({entries, metrics}) => {
  const [pf,sPf]=useState('all');const [tab,sTab]=useState('table');
  const filtered = pf==='all' ? entries : entries.filter(e=>e.platform===pf);
  const exportCSV = () => {
    let csv = 'วันที่,แพลตฟอร์ม,' + metrics.map(m=>m.name).join(',') + '\n';
    filtered.forEach(e => { csv += e.date + ',' + (PF(e.platform).name) + ',' + metrics.map(m=>e[m.id]||0).join(',') + '\n'; });
    const b = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='SocialPulse_Report.csv';a.click();
  };
  const summaryByPlat = useMemo(()=>{
    const r={};PLATFORMS.forEach(p=>{r[p.id]={};metrics.forEach(m=>{r[p.id][m.id]=0;});});
    filtered.forEach(e=>{if(r[e.platform])metrics.forEach(m=>{r[e.platform][m.id]+=(Number(e[m.id])||0);});});
    return r;
  },[filtered,metrics]);

  return <div style={{padding:'24px 28px',maxWidth:1400}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24,flexWrap:'wrap',gap:12}}>
      <div><div style={{fontSize:22,fontWeight:800}}>📊 รายงาน</div><div style={{fontSize:13,color:'#b2bec3'}}>สรุปผลดำเนินงาน พร้อม Export</div></div>
      <div style={{display:'flex',gap:8}}><select value={pf} onChange={e=>sPf(e.target.value)} style={S.sel}><option value="all">ทุกแพลตฟอร์ม</option>{PLATFORMS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select><button onClick={exportCSV} style={S.btn('#6c5ce7')}>📥 Export CSV</button></div>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:20}}>{[{id:'table',l:'ตาราง'},{id:'chart',l:'กราฟ'}].map(t=><button key={t.id} onClick={()=>sTab(t.id)} style={{padding:'8px 16px',borderRadius:8,border:'none',background:tab===t.id?'#6c5ce7':'#f0f0f5',color:tab===t.id?'white':'#636e72',fontSize:13,cursor:'pointer',fontWeight:tab===t.id?600:400}}>{t.l}</button>)}</div>
    {tab==='table' && <div style={{...S.card,padding:0,overflow:'auto'}}>
      <table style={{width:'100%',borderCollapse:'collapse'}}>
        <thead><tr><th style={S.th}>แพลตฟอร์ม</th>{metrics.map(m=><th key={m.id} style={S.th}>{m.icon} {m.name}</th>)}</tr></thead>
        <tbody>{PLATFORMS.filter(p=>pf==='all'||p.id===pf).map(p=><tr key={p.id}><td style={S.td}><div style={{display:'flex',alignItems:'center',gap:8}}><div style={S.pI(p.color)}>{p.icon}</div>{p.name}</div></td>{metrics.map(m=><td key={m.id} style={{...S.td,fontWeight:600}}>{fN(summaryByPlat[p.id]?.[m.id]||0)}</td>)}</tr>)}</tbody>
      </table>
    </div>}
    {tab==='chart' && <div style={S.card}>
      <div style={{fontWeight:700,marginBottom:16}}>เปรียบเทียบแพลตฟอร์ม — {metrics[0]?.name || 'ผู้ติดตาม'}</div>
      <ResponsiveContainer width="100%" height={300}>
        <BarChart data={PLATFORMS.filter(p=>pf==='all'||p.id===pf).map(p=>({name:p.name,value:summaryByPlat[p.id]?.[metrics[0]?.id]||0}))} layout="vertical">
          <CartesianGrid strokeDasharray="3 3"/><XAxis type="number" tickFormatter={v=>fN(v)}/><YAxis type="category" dataKey="name" width={100} tick={{fontSize:12}}/>
          <Tooltip formatter={v=>fN(v)}/><Bar dataKey="value" fill="#6c5ce7" radius={[0,4,4,0]}/>
        </BarChart>
      </ResponsiveContainer>
    </div>}
  </div>;

  const stE=u=>{sEu(u.id);sEp([...(u.permissions||[])]);sEr(u.role);};
  const svP=uid=>{setUsers(p=>p.map(u=>u.id===uid?{...u,permissions:ep,role:er}:u));sEu(null);};
  const tP=pid=>sEp(p=>p.includes(pid)?p.filter(x=>x!==pid):[...p,pid]);
  return <div style={{padding:'24px 28px',maxWidth:1200}}>
    <div style={{fontSize:22,fontWeight:800,marginBottom:4}}>⚙️ จัดการผู้ใช้และสิทธิ์</div>
    <div style={{fontSize:13,color:'#b2bec3',marginBottom:20}}>กำหนดว่า username ไหนเข้าถึงฟังก์ชันไหนได้บ้าง</div>
    {pr.length>0 && <div style={{background:'#fff3cd',borderRadius:14,padding:20,marginBottom:20,border:'1px solid #ffc107'}}><div style={{fontWeight:700,color:'#856404',marginBottom:12}}>📋 คำขอรออนุมัติ ({pr.length})</div>{pr.map((r,i)=><div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0',borderBottom:i<pr.length-1?'1px solid rgba(0,0,0,0.08)':'none'}}><div><div style={{fontWeight:600}}>{r.name}</div><div style={{fontSize:12,color:'#856404'}}>@{r.username}</div></div><div style={{display:'flex',gap:8}}><button onClick={()=>app(r)} style={S.btn('#00b894')}>✅ อนุมัติ</button><button onClick={()=>rej(r)} style={S.btn('#e17055')}>❌ ปฏิเสธ</button></div></div>)}</div>}
    <div style={{...S.card,padding:0}}>
      <div style={{padding:'16px 24px',borderBottom:'1px solid #f0f0f5',fontWeight:700}}>👥 ผู้ใช้ ({users.length})</div>
      {users.map(u=><div key={u.id} style={{padding:'16px 24px',borderBottom:'1px solid #f0f0f5'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:eu===u.id?16:0,flexWrap:'wrap',gap:8}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:40,height:40,borderRadius:'50%',background:u.role==='admin'?'linear-gradient(135deg,#6c5ce7,#a29bfe)':'#dfe6e9',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:700,color:u.role==='admin'?'white':'#636e72'}}>{u.name?.[0]}</div>
            <div><div style={{fontWeight:600}}>{u.name}</div><div style={{fontSize:12,color:'#b2bec3'}}>@{u.username} · {u.role}</div></div>
          </div>
          <div style={{display:'flex',gap:8}}>
            {eu===u.id ? <React.Fragment>
              <select value={er} onChange={e=>sEr(e.target.value)} style={S.sel}><option value="admin">Admin</option><option value="editor">Editor</option><option value="viewer">Viewer</option></select>
              <button onClick={()=>svP(u.id)} style={S.btn('#00b894')}>💾 บันทึก</button>
              <button onClick={()=>sEu(null)} style={S.btnO('#636e72')}>ยกเลิก</button>
            </React.Fragment> : <React.Fragment>
              <button onClick={()=>stE(u)} style={S.btnO('#6c5ce7')}>✏️ แก้ไขสิทธิ์</button>
              {u.id!==1 && <button onClick={()=>setUsers(p=>p.filter(x=>x.id!==u.id))} style={S.btnO('#e17055')}>🗑️</button>}
            </React.Fragment>}
          </div>
        </div>
        {eu===u.id && <div style={{background:'#f8f7ff',borderRadius:10,padding:16,animation:'fadeInUp 0.3s'}}>
          <div style={{fontSize:13,fontWeight:600,color:'#6c5ce7',marginBottom:10}}>กำหนดสิทธิ์การเข้าถึง:</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:8}}>
            {PERMS.map(perm=><label key={perm.id} style={{display:'flex',alignItems:'center',gap:8,fontSize:13,cursor:'pointer',padding:'6px 10px',borderRadius:8,background:ep.includes(perm.id)?'rgba(108,92,231,0.08)':'transparent'}}>
              <input type="checkbox" checked={ep.includes(perm.id)} onChange={()=>tP(perm.id)} style={{width:18,height:18,accentColor:'#6c5ce7'}}/>
              <span style={{color:ep.includes(perm.id)?'#6c5ce7':'#636e72',fontWeight:ep.includes(perm.id)?600:400}}>{perm.label}</span>
            </label>)}
          </div>
        </div>}
        {eu!==u.id && u.permissions && <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>{u.permissions.map(pid=>{const p=PERMS.find(x=>x.id===pid);return p ? <span key={pid} style={S.badge('#f0f0f5','#636e72')}>{p.label}</span> : null;})}</div>}
      </div>)}
    </div>
  </div>;
};

/* ═══ MAIN APP ═══ */
function App() {
  const [cu, sCu] = useState(null);
  const [users, sU] = useState(INIT_USERS);
  const [page, sP] = useState('dashboard');
  const [co, sCo] = useState(false);
  const [pr, sPr] = useState([]);
  const [metrics, setMetrics] = useState(DEFAULT_METRICS);
  const [entries, setEntries] = useState(() => genDemoData(DEFAULT_METRICS));
  const [viewMode, setViewMode] = useState('all');

  if (!cu) return <LoginPage users={users} onLogin={u=>{sCu(u);sP('dashboard');}} onReq={r=>sPr(p=>[...p,r])}/>;

  const sw = co ? 70 : 240;
  return <div style={{fontFamily:"'Prompt','Noto Sans Thai',sans-serif",minHeight:'100vh',background:'#f5f6fa'}}>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <Sidebar page={page} setPage={sP} user={cu} onLogout={()=>sCu(null)} co={co} setCo={sCo}/>
    <div style={{marginLeft:sw,transition:'margin-left 0.3s',minHeight:'100vh'}}>
      <div style={{background:'white',padding:'12px 28px',borderBottom:'1px solid #f0f0f5',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,zIndex:50}}>
        <div style={{fontSize:13,color:'#b2bec3'}}>{USE_SHEETS ? '🟢 เชื่อมต่อ Google Sheets' : '🟡 โหมด Demo'}</div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{position:'relative',cursor:'pointer'}} onClick={()=>{if(pr.length>0&&cu.role==='admin')sP('admin');}}>🔔{pr.length>0 && <span style={{position:'absolute',top:-6,right:-6,width:16,height:16,borderRadius:'50%',background:'#e17055',color:'white',fontSize:10,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}>{pr.length}</span>}</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}><div style={{width:34,height:34,borderRadius:'50%',background:'linear-gradient(135deg,#6c5ce7,#a29bfe)',display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontSize:14,fontWeight:700}}>{cu.name?.[0]}</div><div><div style={{fontSize:13,fontWeight:600}}>{cu.name}</div><div style={{fontSize:10,color:'#b2bec3'}}>{cu.role}</div></div></div>
        </div>
      </div>

      {page==='dashboard' && <DashPage entries={entries} metrics={metrics} viewMode={viewMode} setViewMode={setViewMode}/>}
      {page==='data' && <DataPage entries={entries} setEntries={setEntries} metrics={metrics} setMetrics={setMetrics}/>}
      {page==='reports' && <RepPage entries={entries} metrics={metrics}/>}
      {page==='content' && <ConPage/>}
      {page==='messages' && <MsgPage/>}
      {page==='ads' && <AdsPage/>}
      {page==='ai' && <AIPage entries={entries} metrics={metrics}/>}
      {page==='admin' && (cu.role==='admin' ? <AdminPage users={users} setUsers={sU} pr={pr} setPr={sPr}/> : <div style={{padding:60,textAlign:'center',color:'#b2bec3'}}>🔒 ไม่มีสิทธิ์เข้าถึง</div>)}
    </div>
    <style>{`@keyframes fadeInUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}`}</style>
  </div>;
}

// Error boundary
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  render(){
    if(this.state.hasError) return React.createElement('div',{style:{padding:60,textAlign:'center',fontFamily:"'Prompt',sans-serif"}},
      React.createElement('div',{style:{fontSize:48,marginBottom:16}},'⚠️'),
      React.createElement('div',{style:{fontSize:18,fontWeight:700,marginBottom:8}},'เกิดข้อผิดพลาด'),
      React.createElement('div',{style:{fontSize:14,color:'#636e72',marginBottom:16}},String(this.state.error?.message||'')),
      React.createElement('button',{onClick:function(){location.reload();},style:{padding:'12px 32px',borderRadius:10,border:'none',background:'#6c5ce7',color:'white',fontSize:14,cursor:'pointer'}},'🔄 โหลดใหม่')
    );
    return this.props.children;
  }
}
ReactDOM.render(React.createElement(ErrorBoundary,null,React.createElement(App)),document.getElementById('root'));
</script>
</body>
